<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebXR AR Garden</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: linear-gradient(135deg,#667eea,#764ba2);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.container {
  max-width: 800px;
  width: 100%;
  text-align: center;
  padding: 20px;
}
.button {
  padding: 16px 32px;
  font-size: 1.1rem;
  border: none;
  border-radius: 40px;
  background: linear-gradient(45deg,#4facfe,#00f2fe);
  color: white;
  cursor: pointer;
  margin: 20px;
  transition: transform 0.3s, box-shadow 0.3s;
}
.button:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
.button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.status {
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
  text-align: left;
}
.success { background: rgba(76,175,80,.3); }
.error { background: rgba(244,67,54,.3); }
.warning { background: rgba(255,193,7,.3); }

#ar-view {
  width: 100%;
  height: 400px;
  display: none;
  border-radius: 15px;
  overflow: hidden;
  background: black;
  margin-top: 20px;
}

#fallback-view {
  width: 100%;
  height: 400px;
  display: none;
  border-radius: 15px;
  overflow: hidden;
  background: #111;
  margin-top: 20px;
}

.loader {
  border: 5px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top: 5px solid #4facfe;
  width: 50px;
  height: 50px;
  animation: spin 1s linear infinite;
  margin: 20px auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.hidden {
  display: none !important;
}

.instructions {
  background: rgba(255,255,255,0.1);
  padding: 15px;
  border-radius: 10px;
  margin: 20px 0;
  text-align: left;
  border-left: 4px solid #4facfe;
}

.instructions h3 {
  margin-top: 0;
  color: #4facfe;
}
</style>
</head>

<body>
<div class="container">
  <h1><i class="fas fa-seedling"></i> AR Garden</h1>
  <p>Plant sunflowers in augmented reality 🌻</p>

  <div id="status" class="status warning">
    <i class="fas fa-sync fa-spin"></i> Checking device compatibility...
  </div>

  <div class="instructions">
    <h3><i class="fas fa-info-circle"></i> How to use:</h3>
    <p>1. Tap "Start AR Experience" button</p>
    <p>2. Allow camera access when prompted</p>
    <p>3. Move your phone to detect surfaces</p>
    <p>4. Tap screen to place sunflowers</p>
  </div>

  <button id="startButton" class="button" disabled>
    <i class="fas fa-cube"></i> Start AR Experience
  </button>

  <button id="fallbackButton" class="button hidden" style="background: linear-gradient(45deg,#ff9800,#ff5722);">
    <i class="fas fa-eye"></i> View 3D Demo
  </button>

  <div id="ar-view"></div>
  <div id="fallback-view"></div>
  
  <div id="loading" class="hidden">
    <div class="loader"></div>
    <p>Loading 3D models...</p>
  </div>
</div>

<script>


const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const startButton = document.getElementById("startButton");
const fallbackButton = document.getElementById("fallbackButton");
const statusDiv = document.getElementById("status");
const arView = document.getElementById("ar-view");
const fallbackView = document.getElementById("fallback-view");
const loadingDiv = document.getElementById("loading");

let isWebXRSupported = false;
let isIOSARSupported = false;
let flowerModel = null;
let reticle = null;
let scene, camera, renderer, hitTestSource, xrSession;


function updateStatus(msg, type = "warning", icon = "fa-info-circle") {
  const iconClass = type === 'success' ? 'fa-check-circle' : 
                   type === 'error' ? 'fa-exclamation-circle' : 
                   type === 'warning' ? 'fa-exclamation-triangle' : icon;
  
  statusDiv.innerHTML = `<i class="fas ${iconClass}"></i> ${msg}`;
  statusDiv.className = "status " + type;
}


function startIOSAR() {
  updateStatus("Launching AR on iPhone 📱", "success");
  startButton.style.display = "none";
  fallbackButton.style.display = "none";
  arView.style.display = "block";

  arView.innerHTML = `
    <model-viewer
      src="https://cdn.glitch.global/3c3b1b8f-7b5a-4c4a-9b9b-9c9c9c9c9c9c/sunflower.glb?v=1"
      ar
      ar-modes="quick-look scene-viewer webxr"
      camera-controls
      auto-rotate
      alt="A 3D model of a sunflower"
      style="width:100%; height:100%;">
      <button slot="ar-button" style="
        background-color: #4facfe;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 20px;
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
      ">
        View in AR
      </button>
    </model-viewer>
  `;
  
  setTimeout(() => {
    if (!document.querySelector('model-viewer').canActivateAR) {
      updateStatus("AR Quick Look not available. Try the WebXR version.", "warning");
      startWebXR();
    }
  }, 1000);
}


async function startWebXR() {
  try {
    updateStatus("Starting WebXR AR...", "success");
    startButton.disabled = true;
    startButton.style.display = "none";
    fallbackButton.style.display = "none";
    loadingDiv.classList.remove("hidden");
    arView.style.display = "block";

    const canvas = document.createElement("canvas");
    arView.appendChild(canvas);
    const gl = canvas.getContext("webgl", { xrCompatible: true });
    
    if (!gl) {
      throw new Error("WebGL not supported");
    }

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera();
    camera.matrixAutoUpdate = false;

    renderer = new THREE.WebGLRenderer({ 
      canvas: canvas, 
      context: gl, 
      alpha: true,
      antialias: true 
    });
    renderer.autoClear = false;
    renderer.setSize(arView.clientWidth, arView.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(5, 10, 5);
    scene.add(directionalLight);

    const loader = new THREE.GLTFLoader();
    
    loader.load(
      "https://immersive-web.github.io/webxr-samples/media/gltf/reticle/reticle.gltf",
      (gltf) => {
        reticle = gltf.scene;
        reticle.visible = false;
        scene.add(reticle);
      },
      undefined,
      (error) => {
        console.error("Error loading reticle:", error);

        const geometry = new THREE.RingGeometry(0.05, 0.06, 32);
        const material = new THREE.MeshBasicMaterial({ 
          color: 0xffffff, 
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.8
        });
        reticle = new THREE.Mesh(geometry, material);
        reticle.rotation.x = -Math.PI / 2;
        reticle.visible = false;
        scene.add(reticle);
      }
    );

    flowerModel = await new Promise((resolve) => {
      loader.load(
        "https://immersive-web.github.io/webxr-samples/media/gltf/sunflower/sunflower.gltf",
        (gltf) => {
          resolve(gltf.scene);
        },
        undefined,
        (error) => {
          console.error("Error loading sunflower:", error);
          const geometry = new THREE.ConeGeometry(0.1, 0.3, 8);
          const material = new THREE.MeshStandardMaterial({ color: 0xffd700 });
          const flower = new THREE.Mesh(geometry, material);
          resolve(flower);
        }
      );
    });

    loadingDiv.classList.add("hidden");
    updateStatus("WebXR ready! Tap on surfaces to place flowers.", "success");

    try {
      xrSession = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: ["hit-test"]
      });
    } catch (error) {
      console.log("Trying without hit-test...");
      xrSession = await navigator.xr.requestSession("immersive-ar");
    }

    xrSession.updateRenderState({
      baseLayer: new XRWebGLLayer(xrSession, gl)
    });

    const referenceSpace = await xrSession.requestReferenceSpace("local");
    const viewerSpace = await xrSession.requestReferenceSpace("viewer");
    
    try {
      hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });
    } catch (error) {
      console.log("Hit test not available:", error);
    }

    xrSession.addEventListener("select", (event) => {
      if (flowerModel && reticle && reticle.visible) {
        const flower = flowerModel.clone();
        flower.position.copy(reticle.position);
        
        flower.rotation.y = Math.random() * Math.PI * 2;
        
        flower.scale.set(1.5, 1.5, 1.5);
        
        scene.add(flower);
      }
    });

    const onXRFrame = (time, frame) => {
      xrSession.requestAnimationFrame(onXRFrame);
      
      gl.bindFramebuffer(gl.FRAMEBUFFER, xrSession.renderState.baseLayer.framebuffer);
      
      const pose = frame.getViewerPose(referenceSpace);
      if (pose) {
        const view = pose.views[0];
        const viewport = xrSession.renderState.baseLayer.getViewport(view);
        
        renderer.setSize(viewport.width, viewport.height);
        
        camera.matrix.fromArray(view.transform.matrix);
        camera.projectionMatrix.fromArray(view.projectionMatrix);
        camera.updateMatrixWorld(true);
        
        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0 && reticle) {
            const hitPose = hitTestResults[0].getPose(referenceSpace);
            reticle.visible = true;
            reticle.position.set(
              hitPose.transform.position.x,
              hitPose.transform.position.y,
              hitPose.transform.position.z
            );
            reticle.updateMatrixWorld(true);
          } else if (reticle) {
            reticle.visible = false;
          }
        }
        
        renderer.render(scene, camera);
      }
    };
    
    xrSession.requestAnimationFrame(onXRFrame);
    
    xrSession.addEventListener("end", () => {
      updateStatus("AR session ended. Tap Start to begin again.", "warning");
      resetUI();
    });
    
  } catch (error) {
    console.error("WebXR Error:", error);
    updateStatus(`Error: ${error.message}. Try the 3D demo instead.`, "error");
    loadingDiv.classList.add("hidden");
    fallbackButton.classList.remove("hidden");
    startFallback3D();
  }
}

function startFallback3D() {
  updateStatus("Starting 3D Demo...", "success");
  startButton.style.display = "none";
  fallbackButton.style.display = "none";
  fallbackView.style.display = "block";
  
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, fallbackView.clientWidth / fallbackView.clientHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  
  renderer.setSize(fallbackView.clientWidth, fallbackView.clientHeight);
  fallbackView.appendChild(renderer.domElement);
  
  const ambientLight = new THREE.AmbientLight(0x404040);
  scene.add(ambientLight);
  
  const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
  directionalLight.position.set(5, 10, 5);
  scene.add(directionalLight);
  
  const loader = new THREE.GLTFLoader();
  loader.load(
    "https://immersive-web.github.io/webxr-samples/media/gltf/sunflower/sunflower.gltf",
    (gltf) => {
      const flower = gltf.scene;
      flower.position.set(0, 0, -2);
      flower.scale.set(2, 2, 2);
      scene.add(flower);
    },
    undefined,
    (error) => {
      console.error("Error loading model:", error);
    }
  );
  
  camera.position.z = 5;
  
  function animate() {
    requestAnimationFrame(animate);
    scene.rotation.y += 0.005;
    renderer.render(scene, camera);
  }
  animate();
}


async function checkCompatibility() {
  updateStatus("Checking device capabilities...", "warning");
  
  if (isIOS) {
    isIOSARSupported = true;
    updateStatus("iPhone/iPad detected - AR Quick Look available 📱", "success");
    startButton.disabled = false;
    startButton.innerHTML = '<i class="fas fa-mobile-alt"></i> Start AR (iOS)';
    return;
  }
  
  if (navigator.xr) {
    try {
      isWebXRSupported = await navigator.xr.isSessionSupported("immersive-ar");
      
      if (isWebXRSupported) {
        updateStatus("WebXR AR is supported on your device! 🤖", "success");
        startButton.disabled = false;
        startButton.innerHTML = '<i class="fas fa-vr-cardboard"></i> Start AR (WebXR)';
      } else {
        updateStatus("WebXR AR not available. Try the 3D demo.", "warning");
        fallbackButton.classList.remove("hidden");
      }
    } catch (error) {
      console.error("WebXR check failed:", error);
      updateStatus("Could not check WebXR support.", "error");
      fallbackButton.classList.remove("hidden");
    }
  } else {
    updateStatus("WebXR not supported in your browser.", "error");
    fallbackButton.classList.remove("hidden");
  }
}


function resetUI() {
  startButton.style.display = "block";
  startButton.disabled = false;
  arView.style.display = "none";
  fallbackView.style.display = "none";
  fallbackButton.classList.add("hidden");
  
  if (scene) {
    while(scene.children.length > 0) {
      scene.remove(scene.children[0]);
    }
    scene = null;
  }
  
  if (arView.firstChild) {
    arView.removeChild(arView.firstChild);
  }
}


startButton.addEventListener("click", () => {
  if (isIOS) {
    startIOSAR();
  } else if (isWebXRSupported) {
    startWebXR();
  }
});

fallbackButton.addEventListener("click", startFallback3D);

window.addEventListener("load", () => {
  checkCompatibility();
  
  window.addEventListener("resize", () => {
    if (renderer && arView.contains(renderer.domElement)) {
      renderer.setSize(arView.clientWidth, arView.clientHeight);
    }
  });
});

window.addEventListener("beforeunload", () => {
  if (xrSession) {
    xrSession.end();
  }
});
</script>
</body>
</html>
